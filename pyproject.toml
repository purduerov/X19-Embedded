[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "x19-rov-cli"
version = "0.1.0"
description = "Purdue ROV unified embedded developer CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
can = ["python-can>=4.3"]

[project.scripts]
rov = "tools.rov:main"

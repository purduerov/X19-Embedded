target_f401 = "f411_node3_power_slab.elf"
binary_f401 = "build/arm-c542-debug/boards/f411_nucleo/f411_node3_power_slab.elf"
target_g474 = "g474_node3_power_slab.elf"
binary_g474 = "build/arm-c542-debug/boards/g474_nucleo/g474_node3_power_slab.elf"
target_g431 = "g474_node3_power_slab.elf"
